stages:
  - lint
  - sonar
  - build
  - ansible

# Lint Backend
lint-backend:
  stage: lint
  image: node:18-alpine
  script:
    - cd backend
    - npm ci
    - npx eslint . --ext .js,.ts
  only:
    - branches
  tags:
    - nodejs

# Lint Frontend
lint-frontend:
  stage: lint
  image: node:18-alpine
  script:
    - cd frontend
    - npm install --omit=optional
    - npx eslint . --ext .js,.ts,.svelte
  only:
    - branches
  tags:
    - nodejs

# SonarQube Scan
sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:4
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=Wetter-App \
        -Dsonar.sources=backend,frontend \
        -Dsonar.host.url=https://scm.thm.de/sonar \
        -Dsonar.login=$SONAR_TOKEN
  only:
    - branches
  tags:
    - sonarqube


ansible_deploy:
  stage: ansible
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client ansible
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H WeatherApp.mni.thm.de >> ~/.ssh/known_hosts
    - ssh user@WeatherApp.mni.thm.de 'cd /path/to/ansible && ansible-playbook -i inventory/hosts.yml site-setup.yml'
    - ssh user@WeatherApp.mni.thm.de 'cd /path/to/ansible && ansible-playbook -i inventory/hosts.yml deploy-app.yml'
  only:
    - branches
  tags:
    - kaniko
