stages:
  - lint
  - sonar
  - build
  - deploy

# Lint Backend
lint-backend:
  stage: lint
  image: node:18-alpine
  script:
    - cd backend
    - npm ci
    - npx eslint . --ext .js,.ts
  only:
    - branches
  tags:
    - nodejs

# Lint Frontend
lint-frontend:
  stage: lint
  image: node:18-alpine
  script:
    - cd frontend
    - npm install --omit=optional
    - npx eslint . --ext .js,.ts,.svelte
  only:
    - branches
  tags:
    - nodejs

# SonarQube Scan
sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:4
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=Wetter-App \
        -Dsonar.sources=backend,frontend \
        -Dsonar.host.url=https://scm.thm.de/sonar \
        -Dsonar.login=$SONAR_TOKEN
  only:
    - branches
  tags:
    - sonarqube

# Build Backend Docker Image
build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""] 
  script:
    - echo "Cloud.2025" | docker login -u "dania44" --password-stdin
    - /kaniko/executor --context $CI_PROJECT_DIR/backend --dockerfile $CI_PROJECT_DIR/backend/Dockerfile --destination $CI_REGISTRY_IMAGE/backend:latest --destination $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  only:
    - branches
  tags:
    - kaniko



# Build Frontend Docker Image
build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
        --context $CI_PROJECT_DIR/frontend
        --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile
        --destination $CI_REGISTRY_IMAGE/frontend:latest
        --destination $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  only:
    - branches
  tags:
    - kaniko

# Sicherheits-Scan 
security_scan:
  stage: build
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 0 $CI_REGISTRY_IMAGE/backend:latest
    - trivy image --exit-code 0 $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - branches
  tags:
    - docker

# Deployment mit Ansible 
ansible_deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client ansible git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H WeatherApp.mni.thm.de >> ~/.ssh/known_hosts
  script:
    - ansible-playbook -i ansible/inventory/hosts.yml ansible/site-setup.yml
    - ansible-playbook -i ansible/inventory/hosts.yml ansible/deploy-app.yml
  only:
    - branches
  tags:
    - docker
