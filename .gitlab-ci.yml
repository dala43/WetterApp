stages:
  - lint
  - sonar
  - build
  - deploy

# Lint Backend
lint-backend:
  stage: lint
  image: node:18-alpine
  script:
    - cd backend
    - npm ci
    - npx eslint . --ext .js,.ts
  only:
    - branches
  tags:
    - nodejs

# Lint Frontend
lint-frontend:
  stage: lint
  image: node:18-alpine
  script:
    - cd frontend
    - npm install --omit=optional
    - npx eslint . --ext .js,.ts,.svelte
  only:
    - branches
  tags:
    - nodejs

# SonarQube Scan
sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:4
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=Wetter-App \
        -Dsonar.sources=backend,frontend \
        -Dsonar.host.url=https://scm.thm.de/sonar \
        -Dsonar.login=$SONAR_TOKEN
  only:
    - branches
  tags:
    - sonarqube




# Deployment mit Ansible 
ansible_deploy:
  stage: deploy
  image: alpine:latest
  before_script:
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  - ssh-keyscan -H WeatherApp.mni.thm.de >> ~/.ssh/known_hosts

  script:
 
  - ansible-playbook -i ansible/inventory/hosts.yml ansible/site-setup.yml --private-key ~/.ssh/id_ed25519
  - ansible-playbook -i ansible/inventory/hosts.yml ansible/deploy-app.yml --private-key ~/.ssh/id_ed25519

  only:
    - branches
  tags:
    - alpine
