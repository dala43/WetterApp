services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    restart: always
    networks:
      - weather-app-network
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "8000:80"
    restart: always
    networks:
      - weather-app-network


networks:
  weather-app-network:
    driver: bridge
