services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    restart: always
    networks:
      - weather-app-network

  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    restart: always
    networks:
      - weather-app-network

networks:
  weather-app-network:
    driver: bridge
