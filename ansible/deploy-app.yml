- name: WetterApp deployen
  hosts: all
  become: true

  vars:
    app_directory: /opt/wetterapp

  tasks:
    - name: rsync installieren (Debian/Ubuntu)
      apt:
        name: rsync
        state: present
      when: ansible_os_family == "Debian"

    - name: rsync installieren (RHEL/CentOS)
      yum:
        name: rsync
        state: present
      when: ansible_os_family == "RedHat"

    - name: Zielverzeichnis für Frontend erstellen
      file:
        path: "{{ app_directory }}/frontend"
        state: directory
        recurse: yes

    - name: Frontend synchronisieren
      synchronize:
        src: ../frontend/
        dest: "{{ app_directory }}/frontend/"
        recursive: yes
        delete: yes

    - name: Zielverzeichnis für Backend erstellen
      file:
        path: "{{ app_directory }}/backend"
        state: directory
        recurse: yes

    - name: Backend synchronisieren
      synchronize:
        src: ../backend/
        dest: "{{ app_directory }}/backend/"
        recursive: yes
        delete: yes

    - name: Docker-Compose-Datei kopieren
      copy:
        src: ../docker-compose.yml
        dest: "{{ app_directory }}/docker-compose.yml"
        mode: '0644'

    - name: Container starten
      shell: |
        docker-compose -f {{ app_directory }}/docker-compose.yml up -d --pull always
      args:
        chdir: "{{ app_directory }}"
