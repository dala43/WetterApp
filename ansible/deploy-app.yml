- name: WetterApp deployen
  hosts: all
  become: true

  vars:
    app_directory: /opt/wetterapp

  tasks:
    - name: Zielverzeichnis für Frontend erstellen
      file:
        path: "{{ app_directory }}/frontend"
        state: directory
        recurse: yes

    - name: Frontend-Dateien einzeln kopieren
      copy:
        src: "{{ item }}"
        dest: "{{ app_directory }}/frontend/{{ item | basename }}"
      loop: "{{ lookup('fileglob', '../frontend/*', wantlist=True) }}"

    - name: Zielverzeichnis für Backend erstellen
      file:
        path: "{{ app_directory }}/backend"
        state: directory
        recurse: yes

    - name: Backend-Dateien einzeln kopieren
      copy:
        src: "{{ item }}"
        dest: "{{ app_directory }}/backend/{{ item | basename }}"
      loop: "{{ lookup('fileglob', '../backend/*', wantlist=True) }}"

    - name: Docker-Compose-Datei kopieren
      copy:
        src: ../docker-compose.yml
        dest: "{{ app_directory }}/docker-compose.yml"

    - name: Container starten
      shell: |
        docker-compose -f {{ app_directory }}/docker-compose.yml up -d --pull always
      args:
        chdir: "{{ app_directory }}"