- name: WetterApp deployen
  hosts: all
  become: true

  vars:
    app_directory: /opt/wetterapp

  tasks:
    - name: Zielverzeichnis für Frontend erstellen
      file:
        path: "{{ app_directory }}/frontend"
        state: directory
        recurse: yes

    - name: Frontend-Verzeichnis kopieren (rekursiv)
      copy:
        src: ../frontend/
        dest: "{{ app_directory }}/frontend/"
        recursive: yes

    - name: Zielverzeichnis für Backend erstellen
      file:
        path: "{{ app_directory }}/backend"
        state: directory
        recurse: yes

    - name: Backend-Verzeichnis kopieren (rekursiv)
      copy:
        src: ../backend/
        dest: "{{ app_directory }}/backend/"
        recursive: yes

    - name: Docker-Compose-Datei kopieren
      copy:
        src: ../docker-compose.yml
        dest: "{{ app_directory }}/docker-compose.yml"

    - name: Container starten
      shell: |
        docker-compose -f {{ app_directory }}/docker-compose.yml up -d --pull always
      args:
        chdir: "{{ app_directory }}"
