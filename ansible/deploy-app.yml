- name: WetterApp deployen
  hosts: all
  become: true

  vars:
    app_directory: /opt/wetterapp

  tasks:
    - name: rsync installieren (Debian/Ubuntu)
      apt:
        name: rsync
        state: present
      when: ansible_os_family == "Debian"

    - name: Zielverzeichnis erstellen
      file:
        path: "{{ app_directory }}"
        state: directory

    - name: Docker-Compose-Datei kopieren
      copy:
        src: ../docker-compose.yml
        dest: "{{ app_directory }}/docker-compose.yml"

    - name: Frontend-Verzeichnis kopieren (Copy statt Synchronize)
      copy:
        src: ../frontend/
        dest: "{{ app_directory }}/frontend/"
        recursive: yes

    - name: Backend-Verzeichnis kopieren (Copy statt Synchronize)
      copy:
        src: ../backend/
        dest: "{{ app_directory }}/backend/"
        recursive: yes

    - name: Container starten
      shell: |
        docker-compose -f {{ app_directory }}/docker-compose.yml up -d --pull always
      args:
        chdir: "{{ app_directory }}"
