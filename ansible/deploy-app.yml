# ansible/deploy-app.yml
- name: Deployment der Wetter-App
  hosts: appserver
  become: true
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Deploy-Verzeichnis anlegen
      file:
        path: "{{ app_deploy_path }}"
        state: directory
        mode: '0755'

    - name: docker-compose.yml kopieren
      copy:
        src: ../docker-compose.yml      
        dest: "{{ app_deploy_path }}/docker-compose.yml"
        mode: '0644'

    - name: App via Docker Compose starten
      community.docker.docker_compose:
        project_src: "{{ app_deploy_path }}"
        pull: yes
        state: present
